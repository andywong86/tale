[project]
name = "pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andy Wong", email = "andywong86@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "croniter>=6.2.4",
    "tomlkit>=0.13.3",
    "types-croniter>=6.2.4.20261006",
]

[project.scripts]
pulse = "pulse:main"
build = "project.tasks:build"
test = "project.tasks:test"
typecheck = "project.tasks:typecheck"
lint = "project.tasks:lint"
format = "project.tasks:format"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.0",
]

